<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<title>Lift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --green: #1a7a3c;
  --green-dim: #0f4a24;
  --green-bright: #22a050;
  --blue: #0d47a1;
  --purple: #4a148c;
  --red: #b71c1c;
  --surface: #0e0e0e;
  --surface2: #181818;
  --surface3: #222222;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0f0;
  --text2: #999;
  --text3: #555;
  --accent: #22a050;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--surface); }
body { font-family: 'Syne', sans-serif; color: var(--text); }

/* Layout */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 430px; margin: 0 auto; }

/* Header */
.header { padding: env(safe-area-inset-top, 16px) 20px 0; padding-top: max(env(safe-area-inset-top), 16px); }
.header-inner { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.app-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.app-title span { color: var(--accent); }
.session-pill { font-family: 'DM Mono', monospace; font-size: 11px; background: var(--surface3); border: 1px solid var(--border2); padding: 5px 12px; border-radius: 20px; color: var(--text2); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.session-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Day tabs */
.day-tabs { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; padding: 14px 20px; gap: 8px; }
.day-tab { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 4px; text-align: center; cursor: pointer; transition: all 0.15s; }
.day-tab .tab-letter { font-size: 15px; font-weight: 800; color: var(--text3); transition: color 0.15s; }
.day-tab .tab-name { font-size: 9px; font-weight: 500; color: var(--text3); margin-top: 2px; font-family: 'DM Mono', monospace; letter-spacing: 0.5px; text-transform: uppercase; transition: color 0.15s; }
.day-tab.active { border-color: var(--day-color); background: rgba(255,255,255,0.04); }
.day-tab.active .tab-letter { color: var(--day-color); }
.day-tab.active .tab-name { color: var(--day-color); opacity: 0.8; }

/* Session nav */
.session-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 14px; }
.session-nav-left { display: flex; align-items: center; gap: 10px; }
.nav-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s; }
.nav-btn:active { transform: scale(0.93); background: var(--surface3); }
.nav-btn svg { width: 16px; height: 16px; stroke: var(--text2); stroke-width: 2; fill: none; }
.session-label { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text2); }
.session-date { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); background: none; border: none; color: var(--text2); cursor: pointer; }
input[type="date"].session-date::-webkit-calendar-picker-indicator { filter: invert(0.5); width: 14px; }

/* Progress bar */
.prog-bar-wrap { padding: 0 20px 14px; }
.prog-bar-track { height: 3px; background: var(--surface3); border-radius: 2px; overflow: hidden; }
.prog-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.4s cubic-bezier(0.16,1,0.3,1); }
.prog-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.prog-text { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); }
.prog-pct { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); }

/* Scrollable exercise area */
.ex-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 20px; padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 80px); }
.ex-scroll::-webkit-scrollbar { display: none; }

/* Exercise card */
.ex-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; transition: border-color 0.2s; }
.ex-card.complete { border-color: rgba(34,160,80,0.35); }
.ex-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.ex-name { font-size: 14px; font-weight: 700; line-height: 1.3; flex: 1; padding-right: 8px; }
.ex-badge { font-family: 'DM Mono', monospace; font-size: 10px; background: var(--surface3); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; color: var(--text2); text-align: right; white-space: nowrap; }
.ex-badge .reps { color: var(--accent); font-weight: 500; display: block; }

/* Weight row */
.wt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; background: var(--surface3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; }
.wt-icon { font-size: 13px; color: var(--text3); }
.wt-input { flex: 1; background: none; border: none; font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: #4fc87a; outline: none; min-width: 0; }
.wt-input::placeholder { color: var(--text3); font-size: 16px; }
.wt-unit { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); }
.vs-last-tag { font-family: 'DM Mono', monospace; font-size: 10px; margin-left: 4px; }
.vs-last-tag.up { color: #4fc87a; }
.vs-last-tag.same { color: var(--text3); }
.vs-last-tag.down { color: #e57373; }

/* Set inputs */
.sets-grid { display: grid; gap: 6px; }
.set-row { display: flex; align-items: center; gap: 8px; }
.set-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); width: 14px; }
.set-input { flex: 1; background: var(--surface3); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Mono', monospace; font-size: 17px; font-weight: 500; color: var(--text); text-align: center; padding: 10px 8px; outline: none; transition: all 0.15s; -webkit-appearance: none; }
.set-input:focus { border-color: var(--border2); background: #1e1e1e; }
.set-input.filled { color: #4fc87a; border-color: rgba(34,160,80,0.3); background: rgba(34,160,80,0.06); }
.set-input.hot { color: #ffd54f; border-color: rgba(255,213,79,0.4); background: rgba(255,213,79,0.06); }
.set-flag { font-size: 13px; width: 18px; text-align: center; }

/* Bottom save bar */
.save-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; padding: 12px 20px; padding-bottom: max(env(safe-area-inset-bottom), 12px); background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
.save-btn { flex: 1; padding: 14px; background: var(--accent); border: none; border-radius: var(--radius-sm); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: #fff; cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px; }
.save-btn:active { transform: scale(0.97); opacity: 0.9; }
.clear-btn { padding: 14px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); cursor: pointer; }

/* Toast */
.toast { position: fixed; top: max(env(safe-area-inset-top), 16px); left: 50%; transform: translateX(-50%) translateY(-80px); background: #1e2e22; border: 1px solid rgba(34,160,80,0.4); color: #4fc87a; font-family: 'DM Mono', monospace; font-size: 12px; padding: 10px 20px; border-radius: 20px; z-index: 100; transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* Flags summary */
.flags-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 20px 12px; }
.flag-chip { font-family: 'DM Mono', monospace; font-size: 10px; padding: 4px 10px; border-radius: 20px; border: 1px solid; }
.flag-chip.ready { color: #4fc87a; border-color: rgba(79,200,122,0.3); background: rgba(79,200,122,0.08); }
.flag-chip.close { color: #ffd54f; border-color: rgba(255,213,79,0.3); background: rgba(255,213,79,0.08); }
.flag-chip.building { color: var(--text3); border-color: var(--border); background: var(--surface3); }

input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-inner">
      <div class="app-title">LIFT<span>.</span></div>
      <div class="session-pill" onclick="cycleSession()">
        <div class="dot"></div>
        <span id="header-session">Session 1</span>
      </div>
    </div>
  </div>

  <div class="day-tabs" id="day-tabs">
    <div class="day-tab active" onclick="switchDay(0)" style="--day-color:#22a050">
      <div class="tab-letter">A</div><div class="tab-name">Upper</div>
    </div>
    <div class="day-tab" onclick="switchDay(1)" style="--day-color:#5b8dee">
      <div class="tab-letter">B</div><div class="tab-name">Lower</div>
    </div>
    <div class="day-tab" onclick="switchDay(2)" style="--day-color:#b57bee">
      <div class="tab-letter">C</div><div class="tab-name">Upper</div>
    </div>
    <div class="day-tab" onclick="switchDay(3)" style="--day-color:#ee6b6b">
      <div class="tab-letter">D</div><div class="tab-name">Lower</div>
    </div>
  </div>

  <div class="session-nav">
    <div class="session-nav-left">
      <button class="nav-btn" onclick="changeSession(-1)" aria-label="Previous session">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="session-label" id="session-label">Session 1</span>
      <button class="nav-btn" onclick="changeSession(1)" aria-label="Next session">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <input type="date" class="session-date" id="session-date" onchange="saveDate()">
  </div>

  <div class="prog-bar-wrap">
    <div class="prog-label">
      <span class="prog-text" id="prog-text">0 of 0 sets logged</span>
      <span class="prog-pct" id="prog-pct">0%</span>
    </div>
    <div class="prog-bar-track"><div class="prog-bar-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div class="flags-row" id="flags-row"></div>

  <div class="ex-scroll" id="ex-scroll"></div>

  <div class="save-bar">
    <button class="save-btn" onclick="saveSession()">Save session</button>
    <button class="clear-btn" onclick="clearSession()">Clear</button>
  </div>
</div>

<div class="toast" id="toast">Session saved</div>

<script>
const DAYS = [
  { name:"Upper A", short:"Upper A", color:"#22a050", label:"A", exercises:[
    {name:"Incline DB Press", sets:4, range:"6–10"},
    {name:"Chest-Supported Row", sets:4, range:"8–12"},
    {name:"Flat DB / Machine Press", sets:3, range:"8–12"},
    {name:"Lat Pulldown", sets:3, range:"8–12"},
    {name:"Lateral Raise", sets:4, range:"12–20"},
    {name:"Pec Deck", sets:3, range:"12–15"},
    {name:"Triceps Pressdown", sets:3, range:"10–15"},
    {name:"Biceps Curl", sets:3, range:"10–15"},
    {name:"Abs", sets:3, range:"12–20"},
  ]},
  { name:"Lower A", short:"Lower A", color:"#5b8dee", label:"B", exercises:[
    {name:"Bulgarian Split Squat", sets:4, range:"8–12"},
    {name:"Goblet Squat", sets:4, range:"10–15"},
    {name:"Leg Extension", sets:4, range:"10–15"},
    {name:"Leg Curl", sets:3, range:"10–15"},
    {name:"Calf Raise", sets:4, range:"10–20"},
    {name:"Hanging Knee Raise", sets:3, range:"12–20"},
  ]},
  { name:"Upper B", short:"Upper B", color:"#b57bee", label:"C", exercises:[
    {name:"Shoulder Press", sets:4, range:"6–10"},
    {name:"Pull-Ups / Pulldowns", sets:4, range:"8–12"},
    {name:"Incline DB Press", sets:3, range:"8–12"},
    {name:"One-Arm DB Row", sets:3, range:"8–12"},
    {name:"Reverse Pec Deck", sets:3, range:"12–20"},
    {name:"Lateral Raise", sets:4, range:"12–20"},
    {name:"Biceps Curl", sets:4, range:"10–15"},
    {name:"Triceps Overhead Ext", sets:4, range:"10–15"},
    {name:"Abs", sets:3, range:"12–20"},
  ]},
  { name:"Lower B", short:"Lower B", color:"#ee6b6b", label:"D", exercises:[
    {name:"Romanian Deadlift", sets:4, range:"8–12"},
    {name:"Bulgarian Split Squat", sets:3, range:"10–12"},
    {name:"Leg Curl", sets:4, range:"10–15"},
    {name:"Leg Extension", sets:3, range:"12–15"},
    {name:"Calf Raise", sets:4, range:"10–20"},
    {name:"Abs", sets:3, range:"12–20"},
  ]},
];

let curDay = 0, curSession = 1;
let data = {};

try { data = JSON.parse(localStorage.getItem('lift_v1') || '{}'); } catch(e) {}

function key(d,s) { return `d${d}_s${s}`; }
function getSD() { return data[key(curDay,curSession)] || {date:'',exercises:{}}; }
function getPrev() { return curSession > 1 ? (data[key(curDay,curSession-1)] || null) : null; }

function getMaxReps(range) {
  const m = range.replace('–','-').split('-');
  return parseInt(m[m.length-1]) || 12;
}

function setDayColor(color) {
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--green-bright', color);
}

function switchDay(d) {
  curDay = d; curSession = 1;
  document.querySelectorAll('.day-tab').forEach((t,i) => t.classList.toggle('active', i===d));
  setDayColor(DAYS[d].color);
  render();
}

function changeSession(delta) {
  const n = curSession + delta;
  if (n < 1 || n > 20) return;
  curSession = n;
  render();
}

function cycleSession() {
  changeSession(1);
}

function saveDate() {
  const k = key(curDay, curSession);
  if (!data[k]) data[k] = {date:'', exercises:{}};
  data[k].date = document.getElementById('session-date').value;
  persist();
}

function getExData(ei) {
  const sd = getSD();
  return sd.exercises[ei] || {weight:'', sets:{}};
}

function flagForEx(ei) {
  const ex = DAYS[curDay].exercises[ei];
  const exd = getExData(ei);
  const max = getMaxReps(ex.range);
  let filled=0, ok=0;
  for(let s=0;s<ex.sets;s++) {
    const v = exd.sets[s];
    if(v !== undefined && v !== '') { filled++; if(parseInt(v) >= max) ok++; }
  }
  if(filled === 0) return null;
  if(ok === ex.sets) return 'ready';
  if(ok/ex.sets >= 0.8) return 'close';
  return 'building';
}

function render() {
  const sd = getSD();
  const prev = getPrev();
  const day = DAYS[curDay];

  document.getElementById('session-label').textContent = `Session ${curSession}`;
  document.getElementById('header-session').textContent = `Session ${curSession}`;
  const dateEl = document.getElementById('session-date');
  dateEl.value = sd.date || new Date().toISOString().split('T')[0];

  const scroll = document.getElementById('ex-scroll');
  scroll.innerHTML = '';

  let totalSets = 0, filledSets = 0;
  const flagCounts = {};

  day.exercises.forEach((ex, ei) => {
    totalSets += ex.sets;
    const exd = getExData(ei);
    const prevExd = prev ? (prev.exercises[ei] || null) : null;
    const prevWt = prevExd ? prevExd.weight : null;
    const curWt = exd.weight || '';

    let vsHtml = '';
    if (prevWt && curWt) {
      const diff = parseFloat(curWt) - parseFloat(prevWt);
      if (diff > 0) vsHtml = `<span class="vs-last-tag up">+${diff}lb</span>`;
      else if (diff < 0) vsHtml = `<span class="vs-last-tag down">${diff}lb</span>`;
      else vsHtml = `<span class="vs-last-tag same">= same</span>`;
    } else if (prevWt) {
      vsHtml = `<span class="vs-last-tag same">prev: ${prevWt}</span>`;
    }

    let allFilled = true;
    const setsHtml = Array.from({length: ex.sets}, (_,si) => {
      const v = exd.sets[si];
      const hasVal = v !== undefined && v !== '';
      if (!hasVal) allFilled = false;
      if (hasVal) filledSets++;
      const max = getMaxReps(ex.range);
      const cls = hasVal ? (parseInt(v) >= max ? 'filled' : 'hot') : '';
      const flag = hasVal ? (parseInt(v) >= max ? '✓' : '·') : '';
      return `<div class="set-row">
        <span class="set-num">${si+1}</span>
        <input class="set-input ${cls}" type="number" inputmode="numeric" min="0" max="99"
          placeholder="reps" value="${hasVal ? v : ''}"
          onchange="updateSet(${ei},${si},this.value)"
          oninput="onSetInput(this,${ei},${si})">
        <span class="set-flag">${flag}</span>
      </div>`;
    }).join('');

    const f = flagForEx(ei);
    if (f) flagCounts[f] = (flagCounts[f]||0)+1;
    const cardCls = allFilled ? 'ex-card complete' : 'ex-card';

    const card = document.createElement('div');
    card.className = cardCls;
    card.innerHTML = `
      <div class="ex-top">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-badge">${ex.sets} sets<span class="reps">${ex.range}</span></div>
      </div>
      <div class="wt-row">
        <span class="wt-icon">⚖</span>
        <input class="wt-input" type="number" inputmode="decimal" placeholder="weight"
          value="${curWt}" onchange="updateWeight(${ei},this.value)">
        <span class="wt-unit">lbs ${vsHtml}</span>
      </div>
      <div class="sets-grid">${setsHtml}</div>`;
    scroll.appendChild(card);
  });

  const pct = totalSets > 0 ? Math.round(filledSets/totalSets*100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-text').textContent = `${filledSets} of ${totalSets} sets logged`;

  const fr = document.getElementById('flags-row');
  fr.innerHTML = '';
  if(flagCounts.ready) fr.innerHTML += `<div class="flag-chip ready">${flagCounts.ready} ready to increase</div>`;
  if(flagCounts.close) fr.innerHTML += `<div class="flag-chip close">${flagCounts.close} almost there</div>`;
  if(flagCounts.building) fr.innerHTML += `<div class="flag-chip building">${flagCounts.building} still building</div>`;
}

function ensureEx(ei) {
  const k = key(curDay, curSession);
  if (!data[k]) data[k] = {date: document.getElementById('session-date').value, exercises:{}};
  if (!data[k].exercises[ei]) data[k].exercises[ei] = {weight:'', sets:{}};
}

function updateWeight(ei, val) {
  ensureEx(ei); data[key(curDay,curSession)].exercises[ei].weight = val;
  updateProgress();
}

function updateSet(ei, si, val) {
  ensureEx(ei); data[key(curDay,curSession)].exercises[ei].sets[si] = val;
  updateProgress();
}

function onSetInput(el, ei, si) {
  ensureEx(ei);
  data[key(curDay,curSession)].exercises[ei].sets[si] = el.value;
  const max = getMaxReps(DAYS[curDay].exercises[ei].range);
  const v = parseInt(el.value);
  el.className = 'set-input ' + (el.value ? (v >= max ? 'filled' : 'hot') : '');
  el.nextElementSibling.textContent = el.value ? (v >= max ? '✓' : '·') : '';
  updateProgress();
}

function updateProgress() {
  const day = DAYS[curDay];
  let total=0, filled=0;
  const flagCounts = {};
  day.exercises.forEach((ex,ei) => {
    total += ex.sets;
    const exd = getExData(ei);
    for(let s=0;s<ex.sets;s++) {
      const v = exd.sets[s];
      if(v !== undefined && v !== '') filled++;
    }
    const f = flagForEx(ei); if(f) flagCounts[f]=(flagCounts[f]||0)+1;
  });
  const pct = total > 0 ? Math.round(filled/total*100) : 0;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-text').textContent = `${filled} of ${total} sets logged`;
  const fr = document.getElementById('flags-row');
  fr.innerHTML = '';
  if(flagCounts.ready) fr.innerHTML += `<div class="flag-chip ready">${flagCounts.ready} ready to increase</div>`;
  if(flagCounts.close) fr.innerHTML += `<div class="flag-chip close">${flagCounts.close} almost there</div>`;
  if(flagCounts.building) fr.innerHTML += `<div class="flag-chip building">${flagCounts.building} still building</div>`;
}

function persist() {
  try { localStorage.setItem('lift_v1', JSON.stringify(data)); } catch(e){}
}

function saveSession() {
  const k = key(curDay, curSession);
  if(!data[k]) data[k]={date:'',exercises:{}};
  data[k].date = document.getElementById('session-date').value;
  persist();
  const t = document.getElementById('toast');
  t.textContent = 'Session saved ✓';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function clearSession() {
  if(!confirm('Clear this session?')) return;
  delete data[key(curDay,curSession)];
  persist(); render();
}

// Init
const today = new Date().toISOString().split('T')[0];
document.getElementById('session-date').value = today;
setDayColor(DAYS[0].color);
render();
</script>
</body>
</html>
